{% extends 'base.html' %}
{% block title %}Login — ChatSync{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
        <rect width="40" height="40" rx="12" fill="#6366f1"/>
        <path d="M10 14h20M10 20h14M10 26h17" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <span>ChatSync</span>
    </div>
    <h1>Welcome back</h1>
    <p class="auth-sub">Login karein aur team se jud jayein</p>

    <form method="post" class="auth-form">
      {% csrf_token %}
      {% if form.errors %}
        <div class="form-error">Username ya password galat hai.</div>
      {% endif %}
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="apna username" autofocus required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn--primary btn--full">Login →</button>
    </form>
    <p class="auth-footer">Account nahi? <a href="{% url 'register' %}">Register karen</a></p>
  </div>
</div>
{% endblock %}
